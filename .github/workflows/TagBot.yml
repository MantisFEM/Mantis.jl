name: TagBot
on:
  issue_comment:
    types:
      - created
jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    steps:
      - uses: JuliaRegistries/TagBot@v1
        with:
          branch: main
          # Publish only the release notes given to Registrator (see ReleaseNotes.yml).
          changelog: |
            {% if custom %}
            {{ custom }}
            {% endif %}

            {% if previous_release %}
            [Diff since {{ previous_release }}]({{ compare_url }})
            {% endif %}
          token: ${{ secrets.GITHUB_TOKEN }}
          # For triggering other actions (such as building the docs)
          ssh: ${{ secrets.SSH_DEPLOY_KEY }}
          ssh_password: ${{ secrets.SSH_DEPLOY_PASSPHRASE }}
          # For signing commits
          gpg: ${{ secrets.GPG_ACTION_KEY }}
          gpg_password: ${{ secrets.GPG_ACTION_PASSPHRASE }}
