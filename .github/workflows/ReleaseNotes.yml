name: Release Notes

# Replaces the body of the GitHub release created by TagBot with a list of
# the commits marked `Release-note: yes` since the previous tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Replace release notes with marked commits
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 "$TAG^")"
          {
            echo "[Diff since $prev](https://github.com/$REPO/compare/$prev...$TAG)"
            echo
            python3 .github/scripts/release-notes.py "$prev" "$TAG"
          } > body.md
          # TagBot pushes the tag before it creates the release: wait for it.
          for _ in $(seq 1 30); do
            gh release view "$TAG" > /dev/null 2>&1 && break
            sleep 20
          done
          gh release edit "$TAG" --notes-file body.md
